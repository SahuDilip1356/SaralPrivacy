# spec-chain-managed
name: spec-chain

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    name: Validate spec chains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          if [ -d specs ] && ls specs/*/intent.md >/dev/null 2>&1; then
            python3 scripts/validate_chain.py --all specs/
          else
            echo "No spec chains present — nothing to validate."
          fi

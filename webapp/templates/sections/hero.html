<!-- ── HERO ── -->
<tr>
  <td style="padding:32px 32px 24px;border-bottom:1px solid #E2E8F0;">
    <!-- Phase tag -->
    <div style="margin-bottom:14px;">
      <span style="display:inline-block;background-color:#ECFDF5;color:#07B981;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:5px 12px;border-radius:20px;">
        {{ week_theme }}
      </span>
    </div>
    <!-- Topic heading -->
    <h1 style="font-size:26px;font-weight:700;color:#121A2E;line-height:1.3;margin:0 0 14px;padding:0;">
      {{ topic }}
    </h1>
    <!-- Concept (one line) -->
    <p style="font-size:16px;color:#4A5568;margin:0 0 18px;line-height:1.6;">
      {{ concept }}
    </p>
    <!-- Day badge -->
    <span style="display:inline-block;background-color:#EBF4FF;color:#121A2E;font-size:12px;font-weight:600;padding:5px 12px;border-radius:4px;border-left:3px solid #121A2E;">
      Day {{ day_number }} · DPDPA Daily Brief
    </span>
  </td>
</tr>

const RISK_LABELS = {high:{cls:"risk-high",label:"High risk"},medium:{cls:"risk-medium",label:"Medium risk"},standard:{cls:"risk-standard",label:"Standard risk"}};
let activeFilter = "all";

function buildFilterBtns(){
  const filters=[{id:"all",label:"All"},{id:"phase1",label:"Phase 1"},{id:"phase2",label:"Phase 2"},{id:"high",label:"High risk"},{id:"proc",label:"Processors"},{id:"child",label:"Child data"},{id:"health",label:"Health data"},{id:"financial",label:"Financial"},{id:"biometric",label:"Biometric"}];
  document.getElementById("filter-btns").innerHTML=filters.map(f=>`<button class="fb ${f.id==="all"?"active":""}" onclick="setFilter('${f.id}',this)">${f.label}</button>`).join("");
}
function setFilter(id,btn){activeFilter=id;document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();}

function matches(n,cat,q){
  if(q){
    const hay=[n.name,cat.name,...(n.aliases||[]),...n.tags.map(t=>DB.tags[t]||t)].join(" ").toLowerCase();
    if(!hay.includes(q))return false;
  }
  switch(activeFilter){
    case "all":return true;
    case "phase1":return n.phase===1;
    case "phase2":return n.phase===2;
    case "high":return n.risk==="high";
    case "proc":return n.role==="P"||n.role==="B";
    default:return n.tags.includes(activeFilter);
  }
}

function render(){
  const q=document.getElementById("srch").value.toLowerCase().trim();
  const tbody=document.getElementById("tbody"),noRes=document.getElementById("no-res");
  let html="",total=0,high=0,p1=0,catCount=0;
  DB.categories.forEach(cat=>{
    const rows=DB.niches.filter(n=>n.cat===cat.id&&matches(n,cat,q));
    if(!rows.length)return;
    catCount++;
    html+=`<tr class="cat-row"><td colspan="6"><i class="ti ${cat.icon} cat-icon" aria-hidden="true"></i>${cat.name} <span style="color:var(--color-text-secondary);font-weight:400">(${rows.length})</span></td></tr>`;
    rows.forEach(n=>{
      total++;if(n.risk==="high")high++;if(n.phase===1)p1++;
      const tagsHtml=n.tags.map(t=>`<span class="dt dt-${t}">${DB.tags[t]||t}</span>`).join("");
      const rl=RISK_LABELS[n.risk];
      const aliasHtml=(n.aliases&&n.aliases.length)?`<span class="aliases">also: ${n.aliases.join(", ")}</span>`:"";
      html+=`<tr>
        <td class="row-num">${total}</td>
        <td style="font-weight:500">${n.name}${aliasHtml}</td>
        <td><span class="cat-badge role-${n.role}" title="${DB.roles[n.role]}">${n.role==="F"?"Fiduciary":n.role==="P"?"Processor":"Both"}</span></td>
        <td><div class="data-tags">${tagsHtml}</div></td>
        <td><span class="cat-badge ${rl.cls}">${rl.label}</span></td>
        <td><span class="ph ph-${n.phase}">P${n.phase}</span></td>
      </tr>`;
    });
  });
  document.getElementById("cat-count").textContent=catCount;
  document.getElementById("niche-count").textContent=total;
  document.getElementById("high-count").textContent=high;
  document.getElementById("p1-count").textContent=p1;
  if(!html){tbody.innerHTML="";noRes.style.display="block";}else{tbody.innerHTML=html;noRes.style.display="none";}
}
buildFilterBtns();render();
</script>

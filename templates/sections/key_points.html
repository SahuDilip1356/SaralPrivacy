<!-- ── KEY POINTS ── -->
<tr>
  <td style="padding:28px 32px;border-bottom:1px solid #E2E8F0;">
    <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#F4941B;margin:0 0 14px;">
      {{ key_points.heading }}
    </p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {% for point in key_points['points'] %}
      <tr>
        <td style="padding:10px 0;border-bottom:1px solid #F0F4F8;{% if loop.last %}border-bottom:none;{% endif %}vertical-align:top;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="width:20px;vertical-align:top;padding-top:2px;">
                <span style="color:#F4941B;font-weight:700;font-size:15px;">→</span>
              </td>
              <td style="font-size:15px;color:#2D3748;line-height:1.6;padding-left:8px;">
                {{ point }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
      {% endfor %}
    </table>
  </td>
</tr>
